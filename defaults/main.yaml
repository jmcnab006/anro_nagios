---
anro_nagios_enabled: true
anro_nagios_install: true
anro_nagios_configure: true
anro_nagios_install_helper: true

anro_nagios_package_state: present

# Base packages required for Nagios and its Apache web interface. Postfix/mail
# packages are managed separately so local mail delivery can be disabled.
anro_nagios_packages:
  - apache2
  - libapache2-mod-php
  - monitoring-plugins-contrib
  - nagios4
  - openssl
  - ssl-cert
  - perl
  - php
  - php-gd
  - python3-passlib
  - wget
  - unzip
  - libnet-snmp-perl
  - libcrypt-x509-perl
  - libdatetime-format-dateparse-perl
  - libwww-perl
  - libjson-perl
  - libjson-parse-perl
  - liblwp-protocol-https-perl
  - libtext-glob-perl
  - libdbd-mysql-perl

# Local Postfix support is enabled by default for Nagios email notifications.
# Disable it when another MTA or notification transport is managed externally.
anro_nagios_postfix_enabled: true
anro_nagios_postfix_packages:
  - postfix
  - mailutils
anro_nagios_postfix_service_enabled: true
anro_nagios_postfix_service_state: started
anro_nagios_postfix_relayhost: ""
anro_nagios_postfix_inet_interfaces: loopback-only
# Sender address used for locally generated Nagios email.
# Leave empty to preserve the original envelope/header sender.
anro_nagios_postfix_from_address: ""

# Reply-To header added to outbound Nagios email.
# Leave empty to avoid adding a Reply-To header.
anro_nagios_postfix_reply_to_address: ""

# Domain and canonical server name used by Apache and Postfix. Supplying an
# already-qualified inventory_hostname does not append the domain a second time.
anro_nagios_domain: example.com
anro_nagios_server_name: >-
  {{ inventory_hostname if '.' in inventory_hostname else inventory_hostname ~ '.' ~ anro_nagios_domain }}

# Service lifecycle settings. Restart/reload actions are handler-owned so the
# requested state remains idempotent across repeated role executions.
anro_nagios_service: nagios4.service
anro_nagios_service_enabled: true
anro_nagios_service_state: started
anro_nagios_apache_service_enabled: true
anro_nagios_apache_service_state: started

# Create /etc/nagios as a compatibility symlink when the package configuration
# lives elsewhere. The role refuses to replace a real directory at this path.
anro_nagios_create_compat_symlink: true
anro_nagios_compat_symlink_path: /etc/nagios

# Web users written to the role-managed htpasswd file.
anro_nagios_users: []

# Nagios package paths. These normally should not need to change on Ubuntu.
anro_nagios_cfg_path: /etc/nagios4
anro_nagios_objects_path: "{{ anro_nagios_cfg_path }}/objects"
anro_nagios_binary: /usr/sbin/nagios4
anro_nagios_cfg_file: "{{ anro_nagios_cfg_path }}/nagios.cfg"
anro_nagios_libexec_path: /usr/lib/nagios/plugins
anro_nagios_cfg_backup_path: "{{ anro_nagios_cfg_path }}/backup"
anro_nagios_packaged_objects_remove:
  - printer.cfg
  - switch.cfg
  - windows.cfg

# Additional package customization.
anro_nagios_add_packages: []
anro_nagios_remove_packages: []

# Apache authentication settings.
anro_nagios_auth_realm: monitoring
anro_nagios_apache_server_admin: root@localhost
anro_nagios_htpasswd_file: /etc/nagios4/htpassword.users

# TLS certificate paths. The certificate file should contain the complete
# certificate chain when intermediates are required by the deployment.
anro_nagios_certificate_key_file: /etc/ssl/private/ssl-cert-snakeoil.key
anro_nagios_certificate_file: /etc/ssl/certs/ssl-cert-snakeoil.pem
# Deprecated compatibility variable. Apache 2.4 uses the chain supplied in
# anro_nagios_certificate_file; this variable is no longer rendered.
anro_nagios_certificate_chain_file: /etc/ssl/certs/ssl-cert-snakeoil.pem

anro_nagios_basic_auth_provider:
  - file

# LDAP authentication is optional. When disabled, LDAP configuration containing
# credentials is removed from disk.
anro_nagios_use_ldap: false
anro_nagios_ldap_provider: nagios-ldap
anro_nagios_certificate_auth_file: /etc/ssl/certs/ssl-cert-snakeoil.pem
anro_nagios_auth_ldap_bind_dn: ""
anro_nagios_auth_ldap_bind_pw: ""
anro_nagios_auth_ldap_url: ""

# Settings merged into the role defaults for the packaged Nagios files.
anro_nagios_cgi_cfg: {}
anro_nagios_cfg: {}
anro_nagios_resource_cfg: {}

# Standard Nagios definitions shared through playbook/group variables. Entries
# with the same logical name replace the matching built-in role definition.
anro_nagios_commands: []
anro_nagios_contacts: []
anro_nagios_contactgroups: []
anro_nagios_templates_host: []
anro_nagios_templates_contact: []
anro_nagios_templates_contactgroup: []
anro_nagios_templates_service: []
anro_nagios_templates_timeperiod: []

# Baseline localhost monitoring. The entire service list is overridable so sites
# can remove checks that do not apply or add standard local checks consistently.
anro_nagios_localhost_enabled: true
anro_nagios_localhost_host_name: "{{ inventory_hostname }}"
anro_nagios_localhost_alias: "{{ inventory_hostname }}"
anro_nagios_localhost_address: 127.0.0.1
anro_nagios_localhost_hostgroup: monitor-servers
anro_nagios_local_load_warning_multiplier: 1.0
anro_nagios_local_load_critical_multiplier: 1.5
anro_nagios_local_services:
  - service_description: PING
    check_command: check_ping!100.0,20%!500.0,60%
  - service_description: Root Partition
    check_command: check_local_disk!20%!10%!/
  - service_description: Current Users
    check_command: check_local_users!20!50
  - service_description: Total Processes
    check_command: check_local_procs!4000!8000!RSZDT
  - service_description: Current Load
    auto_load: true
  - service_description: SSH
    check_command: check_ssh
  - service_description: HTTP
    check_command: check_http

# Optional Twilio SMS notification helper credentials.
anro_nagios_twilio_number: ""
anro_nagios_twilio_account_sid: ""
anro_nagios_twilio_auth_token: ""

# Optional Prometheus-compatible metrics endpoint served directly by Apache.
# The default port matches the conventional Apache exporter listen port.
anro_nagios_prometheus_endpoint_enabled: false
anro_nagios_prometheus_listen_address: "0.0.0.0"
anro_nagios_prometheus_port: 9117
anro_nagios_prometheus_path: "/metrics"
anro_nagios_prometheus_source_file: "/var/www/html/metrics.php"
anro_nagios_prometheus_https_enabled: false
anro_nagios_prometheus_auth_enabled: false
anro_nagios_prometheus_auth_realm: "prometheus-metrics"
anro_nagios_prometheus_auth_users: "{{ anro_nagios_users }}"
anro_nagios_prometheus_htpasswd_file: "{{ anro_nagios_cfg_path }}/prometheus.htpasswd"
anro_nagios_prometheus_certificate_key_file: "{{ anro_nagios_certificate_key_file }}"
anro_nagios_prometheus_certificate_file: "{{ anro_nagios_certificate_file }}"
