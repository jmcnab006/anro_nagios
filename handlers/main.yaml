---
- name: Validate Apache configuration
  ansible.builtin.command:
    argv:
      - apachectl
      - configtest
  register: _anro_nagios_apache_configtest
  listen:
    - anro_reload_apache
  changed_when: false
  failed_when: >-
    _anro_nagios_apache_configtest.rc != 0 or
    'Syntax OK' not in
    (_anro_nagios_apache_configtest.stderr ~ _anro_nagios_apache_configtest.stdout)

- name: Reload Apache
  ansible.builtin.service:
    name: apache2
    state: reloaded
  when: anro_nagios_apache_service_state != 'stopped'
  throttle: 1
  register: _anro_nagios_apache_reload
  until: _anro_nagios_apache_reload is succeeded
  retries: 5
  delay: 2
  listen:
    - anro_reload_apache
    # add our anro_certs_updated
    - anro_certs_updated

- name: Validate Nagios configuration
  ansible.builtin.command:
    argv:
      - "{{ anro_nagios_binary }}"
      - -v
      - "{{ anro_nagios_cfg_file }}"
  register: _anro_nagios_configtest
  listen:
    - anro_reload_nagios
  changed_when: false
  failed_when: >-
    _anro_nagios_configtest.rc != 0 or
    'Total Errors:   0' not in
    (_anro_nagios_configtest.stdout ~ _anro_nagios_configtest.stderr)

- name: Reload Nagios
  ansible.builtin.service:
    name: "{{ anro_nagios_service }}"
    state: reloaded
  listen:
    - anro_reload_nagios
  when: anro_nagios_service_state != 'stopped'

- name: Validate Postfix configuration
  ansible.builtin.command:
    argv:
      - postfix
      - check
  changed_when: false
  listen: anro_restart_postfix

- name: Restart Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted
  listen: anro_restart_postfix
  when:
    - anro_nagios_postfix_enabled | bool
    - anro_nagios_postfix_service_state != 'stopped'
