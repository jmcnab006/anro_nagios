---
argument_specs:
  main:
    short_description: Configure and manage Nagios Core on Ubuntu
    options:
      anro_nagios_enabled:
        type: bool
        default: true

      anro_nagios_install:
        type: bool
        default: true

      anro_nagios_configure:
        type: bool
        default: true

      anro_nagios_install_helper:
        type: bool
        default: true

      anro_nagios_package_state:
        type: str
        default: present
        choices:
          - present
          - latest

      anro_nagios_packages:
        type: list
        elements: str

      anro_nagios_postfix_enabled:
        type: bool
        default: true

      anro_nagios_postfix_packages:
        type: list
        elements: str

      anro_nagios_postfix_service_enabled:
        type: bool
        default: true

      anro_nagios_postfix_service_state:
        type: str
        default: started
        choices:
          - started
          - stopped

      anro_nagios_postfix_relayhost:
        type: str
        default: ""

      anro_nagios_postfix_inet_interfaces:
        type: str
        default: loopback-only

      anro_nagios_domain:
        type: str
        default: example.com

      anro_nagios_server_name:
        type: str

      anro_nagios_service:
        type: str
        default: nagios4.service

      anro_nagios_service_enabled:
        type: bool
        default: true

      anro_nagios_service_state:
        type: str
        default: started
        choices:
          - started
          - stopped

      anro_nagios_apache_service_enabled:
        type: bool
        default: true

      anro_nagios_apache_service_state:
        type: str
        default: started
        choices:
          - started
          - stopped

      anro_nagios_create_compat_symlink:
        type: bool
        default: true

      anro_nagios_compat_symlink_path:
        type: path
        default: /etc/nagios

      anro_nagios_users:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
          password:
            type: str
            required: true
            no_log: true

      anro_nagios_cfg_path:
        type: path
        default: /etc/nagios4

      anro_nagios_objects_path:
        type: path

      anro_nagios_binary:
        type: path
        default: /usr/sbin/nagios4

      anro_nagios_cfg_file:
        type: path

      anro_nagios_libexec_path:
        type: path
        default: /usr/lib/nagios/plugins

      anro_nagios_cfg_backup_path:
        type: path

      anro_nagios_packaged_objects_remove:
        type: list
        elements: str
        default:
          - printer.cfg
          - switch.cfg
          - windows.cfg

      anro_nagios_add_packages:
        type: list
        elements: str
        default: []

      anro_nagios_remove_packages:
        type: list
        elements: str
        default: []

      anro_nagios_auth_realm:
        type: str
        default: monitoring

      anro_nagios_apache_server_admin:
        type: str
        default: root@localhost

      anro_nagios_prometheus_endpoint_enabled:
        type: bool
        default: false

      anro_nagios_prometheus_listen_address:
        type: str
        default: 0.0.0.0

      anro_nagios_prometheus_port:
        type: int
        default: 9117

      anro_nagios_prometheus_path:
        type: str
        default: /metrics

      anro_nagios_prometheus_source_file:
        type: path
        default: /var/www/html/metrics.php

      anro_nagios_prometheus_https_enabled:
        type: bool
        default: false

      anro_nagios_prometheus_auth_enabled:
        type: bool
        default: false

      anro_nagios_prometheus_auth_realm:
        type: str
        default: prometheus-metrics

      anro_nagios_prometheus_auth_users:
        type: list
        elements: dict
        options:
          name:
            type: str
            required: true
          password:
            type: str
            required: true
            no_log: true

      anro_nagios_prometheus_htpasswd_file:
        type: path
        default: "{{ anro_nagios_cfg_path }}/prometheus.htpasswd"

      anro_nagios_prometheus_certificate_key_file:
        type: path
        default: "{{ anro_nagios_certificate_key_file }}"

      anro_nagios_prometheus_certificate_file:
        type: path
        default: "{{ anro_nagios_certificate_file }}"

      anro_nagios_htpasswd_file:
        type: path
        default: /etc/nagios4/htpassword.users

      anro_nagios_certificate_key_file:
        type: path
        default: /etc/ssl/private/ssl-cert-snakeoil.key

      anro_nagios_certificate_file:
        type: path
        default: /etc/ssl/certs/ssl-cert-snakeoil.pem

      # Deprecated compatibility input. The certificate chain should be included
      # in anro_nagios_certificate_file for modern Apache releases.
      anro_nagios_certificate_chain_file:
        type: path
        default: /etc/ssl/certs/ssl-cert-snakeoil.pem

      anro_nagios_basic_auth_provider:
        type: list
        elements: str
        default:
          - file

      anro_nagios_use_ldap:
        type: bool
        default: false

      anro_nagios_ldap_provider:
        type: str
        default: nagios-ldap

      anro_nagios_certificate_auth_file:
        type: path
        default: /etc/ssl/certs/ssl-cert-snakeoil.pem

      anro_nagios_auth_ldap_bind_dn:
        type: str
        default: ""

      anro_nagios_auth_ldap_bind_pw:
        type: str
        default: ""
        no_log: true

      anro_nagios_auth_ldap_url:
        type: str
        default: ""

      anro_nagios_cgi_cfg:
        type: dict
        default: {}

      anro_nagios_cfg:
        type: dict
        default: {}

      anro_nagios_resource_cfg:
        type: dict
        default: {}

      anro_nagios_commands:
        type: list
        elements: dict
        default: []
        options:
          command_name:
            type: str
            required: true
          command_line:
            type: str
            required: true

      anro_nagios_contacts:
        type: list
        elements: dict
        default: []

      anro_nagios_contactgroups:
        type: list
        elements: dict
        default: []

      anro_nagios_templates_host:
        type: list
        elements: dict
        default: []

      anro_nagios_templates_contact:
        type: list
        elements: dict
        default: []

      anro_nagios_templates_contactgroup:
        type: list
        elements: dict
        default: []

      anro_nagios_templates_service:
        type: list
        elements: dict
        default: []

      anro_nagios_templates_timeperiod:
        type: list
        elements: dict
        default: []

      anro_nagios_localhost_enabled:
        type: bool
        default: true

      anro_nagios_localhost_host_name:
        type: str

      anro_nagios_localhost_alias:
        type: str

      anro_nagios_localhost_address:
        type: str
        default: 127.0.0.1

      anro_nagios_localhost_hostgroup:
        type: str
        default: monitor-servers

      anro_nagios_local_load_warning_multiplier:
        type: float
        default: 1.0

      anro_nagios_local_load_critical_multiplier:
        type: float
        default: 1.5

      anro_nagios_local_services:
        type: list
        elements: dict
        options:
          service_description:
            type: str
            required: true
          check_command:
            type: str
          auto_load:
            type: bool
            default: false
          use:
            type: str
            default: local-service
          options:
            type: dict
            default: {}

      anro_nagios_twilio_number:
        type: str
        default: ""

      anro_nagios_twilio_account_sid:
        type: str
        default: ""
        no_log: true

      anro_nagios_twilio_auth_token:
        type: str
        default: ""
        no_log: true
