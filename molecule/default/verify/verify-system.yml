- name: VERIFY SYSTEM | Assert hostname matches inventory_hostname
  ansible.builtin.assert:
    that:
      - ansible_hostname == inventory_hostname
    fail_msg: "Hostname is {{ ansible_hostname }}, expected {{ inventory_hostname }}"
    success_msg: "Hostname correctly set to {{ ansible_hostname }}"

- name: VERIFY SYSTEM | Read each sysctl parameter from running kernel
  ansible.builtin.command:
    cmd: sysctl -n {{ item.name }}
  register: sysctl_results
  changed_when: false
  when: item.state | default('present') == 'present'
  loop: "{{ usi_server_kernel_parameters }}"
  loop_control:
    label: "{{ item.name }}"

- name: VERIFY SYSTEM | Assert each sysctl value matches expected
  ansible.builtin.assert:
    that:
      - item.stdout | trim == usi_server_kernel_parameters[index].value | string
    fail_msg: >
      {{ usi_server_kernel_parameters[index].name }} =
      '{{ item.stdout | trim }}', expected
      '{{ usi_server_kernel_parameters[index].value }}'
    success_msg: >
      {{ usi_server_kernel_parameters[index].name }} =
      {{ item.stdout | trim }}
  when: not item.skipped | default(false)
  loop: "{{ sysctl_results.results }}"
  loop_control:
    index_var: index
    label: "{{ usi_server_kernel_parameters[index].name }}"

- name: VERIFY SYSTEM | Build list of unique sysctl target files
  ansible.builtin.set_fact:
    sysctl_target_files: >-
      {{
        usi_server_kernel_parameters
        | map(attribute='sysctl_file', default='/etc/sysctl.d/99-usi.conf')
        | unique
        | list
      }}

- name: VERIFY SYSTEM | Stat each sysctl config file
  ansible.builtin.stat:
    path: "{{ item }}"
  register: sysctl_file_stats
  loop: "{{ sysctl_target_files }}"
  loop_control:
    label: "{{ item }}"

- name: VERIFY SYSTEM | Assert each sysctl config file exists
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "sysctl config file {{ item.item }} was not created"
    success_msg: "{{ item.item }} exists"
  loop: "{{ sysctl_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: VERIFY SYSTEM | Slurp each sysctl config file
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: sysctl_file_contents
  loop: "{{ sysctl_target_files }}"
  loop_control:
    label: "{{ item }}"

- name: VERIFY SYSTEM | Assert each parameter persisted in its target file
  ansible.builtin.assert:
    that:
      >-
      item.name + '=' + item.value | string in (
        sysctl_file_contents.results
        | selectattr('item', 'equalto', item.sysctl_file | default('/etc/sysctl.d/99-usi.conf'))
        | map(attribute='content')
        | first
        | b64decode
      )
    fail_msg: >
      '{{ item.name }} = {{ item.value }}' not found in
      {{ item.sysctl_file | default('/etc/sysctl.d/99-usi.conf') }}
    success_msg: >
      {{ item.name }} = {{ item.value }} persisted in
      {{ item.sysctl_file | default('/etc/sysctl.d/99-usi.conf') }}
  when: item.state | default('present') == 'present'
  loop: "{{ usi_server_kernel_parameters }}"
  loop_control:
    label: "{{ item.name }}"
