---
- name: VERIFY FACTS | Load role default vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../../defaults/main.yaml"

- name: VERIFY FACTS | Load role OS-specific vars
  ansible.builtin.include_vars:
    dir: "{{ playbook_dir }}/../../vars"
    files_matching: "{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}.yaml"

- name: VERIFY FACTS | Load molecule test vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/inventory/group_vars/server.yml"

- name: VERIFY FACTS | Gather package facts
  ansible.builtin.package_facts:
