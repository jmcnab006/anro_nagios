---
- name: Verify Nagios role end to end
  hosts: server
  become: true
  gather_facts: true

  vars:
    nagios_cmd_path: /usr/local/bin/nagios-cmd

    # Packages are validated independently from service state so installation
    # failures are easier to distinguish from runtime failures.
    molecule_required_packages:
      - apache2
      - nagios4
      - postfix
      - python3-passlib

    # Administrator-managed files created during verification. These are
    # checksummed before and after role reconvergence to prove the role does
    # not overwrite content managed by nagios-cmd or an administrator.
    molecule_custom_paths:
      - /etc/nagios4/objects/hosts/default/hostgroup.cfg
      - /etc/nagios4/objects/hosts/default/molecule-helper-host.cfg
      - /etc/nagios4/objects/hosts/default/molecule-test-host.cfg
      - /etc/nagios4/objects/hosts/default/molecule-test-host-override.cfg
      - /etc/nagios4/objects/commands/check_molecule_helper.cfg
      - /etc/nagios4/objects/commands/manual-molecule.cfg
      - /etc/nagios4/objects/contacts/molecule-test-contact.cfg
      - /etc/nagios4/objects/contactgroups/molecule-sev1-contacts.cfg
      - /etc/nagios4/objects/templates/molecule-host-parent.cfg
      - /etc/nagios4/objects/templates/molecule-sev1-host.cfg
      - /etc/nagios4/objects/templates/molecule-sev1-service.cfg
      - /etc/nagios4/servicedefs/molecule-ping.tpl

    # Files generated by nagios-cmd during this scenario are removed before
    # testing so molecule verify can be executed repeatedly without duplicate
    # service or object definitions accumulating.
    molecule_cli_cleanup_paths:
      - /etc/nagios4/objects/hosts/default/molecule-helper-host.cfg
      - /etc/nagios4/objects/hosts/default/molecule-test-host.cfg
      - /etc/nagios4/objects/hosts/default/molecule-test-host-override.cfg
      - /etc/nagios4/objects/commands/check_molecule_helper.cfg
      - /etc/nagios4/objects/commands/manual-molecule.cfg
      - /etc/nagios4/objects/contacts/molecule-test-contact.cfg
      - /etc/nagios4/objects/contactgroups/molecule-sev1-contacts.cfg
      - /etc/nagios4/objects/templates/molecule-host-parent.cfg
      - /etc/nagios4/objects/templates/molecule-sev1-host.cfg
      - /etc/nagios4/objects/templates/molecule-sev1-service.cfg
      - /etc/nagios4/objects/templates/molecule-invalid-template.cfg
      - /etc/nagios4/servicedefs/molecule-ping.tpl

    nagios_test_host: molecule-test-host
    nagios_test_host_override: molecule-test-host-override
    nagios_test_contact: molecule-test-contact
    nagios_test_contactgroup: molecule-sev1-contacts
    nagios_test_parent_host_template: molecule-host-parent
    nagios_test_host_template: molecule-sev1-host
    nagios_test_service_template: molecule-sev1-service

  tasks:
    ###########################################################################
    # Package installation
    ###########################################################################

    # Gather package state from the converged instance rather than assuming
    # installation succeeded because the converge play completed.
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    # Verify every package required by the role is actually installed.
    - name: Verify required Nagios packages are installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts.packages
        fail_msg: "Required package {{ item }} is not installed."
      loop: "{{ molecule_required_packages }}"

    ###########################################################################
    # Configuration syntax
    ###########################################################################

    # Apache must pass its native configuration parser before runtime tests
    # are meaningful.
    - name: Validate Apache configuration
      ansible.builtin.command:
        argv:
          - apachectl
          - configtest
      register: molecule_apache_configtest
      changed_when: false

    # Verify Apache explicitly reported a valid configuration.
    - name: Verify Apache configuration validation succeeded
      ansible.builtin.assert:
        that:
          - molecule_apache_configtest.rc == 0
          - >-
            'Syntax OK' in
            (molecule_apache_configtest.stdout ~ molecule_apache_configtest.stderr)

    # Postfix provides a native configuration validation command and should
    # pass it after the role renders its configuration.
    - name: Validate Postfix configuration
      ansible.builtin.command:
        argv:
          - postfix
          - check
      changed_when: false

    # Validate the complete Nagios object tree produced by the role before
    # nagios-cmd creates any administrator-managed objects.
    - name: Validate baseline Nagios configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/nagios4
          - -v
          - /etc/nagios4/nagios.cfg
      register: molecule_nagios_configtest
      changed_when: false

    # Nagios must report zero object/configuration errors.
    - name: Verify baseline Nagios configuration validation succeeded
      ansible.builtin.assert:
        that:
          - molecule_nagios_configtest.rc == 0
          - >-
            'Total Errors:   0' in
            (molecule_nagios_configtest.stdout ~ molecule_nagios_configtest.stderr)

    ###########################################################################
    # Service state
    ###########################################################################

    # Gather systemd service state from the converged instance.
    - name: Gather service facts
      ansible.builtin.service_facts:

    # Verify all services managed by this scenario exist and are currently
    # running.
    - name: Verify managed services are running
      ansible.builtin.assert:
        that:
          - item in ansible_facts.services
          - ansible_facts.services[item].state == 'running'
        fail_msg: "{{ item }} is missing or not running."
      loop:
        - apache2.service
        - nagios4.service
        - postfix.service

    ###########################################################################
    # Managed file permissions
    ###########################################################################

    # Capture metadata for the primary configuration files owned by Ansible.
    - name: Stat generated Nagios configuration files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: molecule_nagios_config_stats
      loop:
        - path: /etc/nagios4/nagios.cfg
          mode: "0644"
        - path: /etc/nagios4/cgi.cfg
          mode: "0644"
        - path: /etc/nagios4/resource.cfg
          mode: "0640"
        - path: /etc/nagios4/objects/commands.cfg
          mode: "0640"
        - path: /etc/nagios4/objects/contacts.cfg
          mode: "0640"
        - path: /etc/nagios4/objects/templates.cfg
          mode: "0640"
        - path: /etc/nagios4/objects/timeperiods.cfg
          mode: "0640"
      loop_control:
        label: "{{ item.path }}"

    # Assert that sensitive and general configuration files have the expected
    # file type and permissions.
    - name: Verify generated Nagios configuration permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == item.item.mode
        fail_msg: >-
          {{ item.item.path }} is missing or has mode
          {{ item.stat.mode | default('unknown') }}; expected {{ item.item.mode }}.
      loop: "{{ molecule_nagios_config_stats.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    # Capture directory metadata for areas intentionally delegated to
    # nagios-cmd and administrators.
    - name: Stat administrator-managed Nagios directories
      ansible.builtin.stat:
        path: "{{ item }}"
      register: molecule_custom_directory_stats
      loop:
        - /etc/nagios4/objects/commands
        - /etc/nagios4/objects/contacts
        - /etc/nagios4/objects/contactgroups
        - /etc/nagios4/objects/hosts/default
        - /etc/nagios4/objects/servicegroups
        - /etc/nagios4/objects/templates
        - /etc/nagios4/objects/timeperiods
        - /etc/nagios4/servicedefs

    # Administrator-managed directories must remain writable by the Nagios
    # account while preventing access by unrelated users.
    - name: Verify administrator-managed directory permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.mode == '0750'
          - item.stat.pw_name == 'nagios'
          - item.stat.gr_name == 'nagios'
      loop: "{{ molecule_custom_directory_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Capture the authentication database metadata separately because it has
    # different ownership requirements from Nagios object configuration.
    - name: Stat Nagios htpasswd file
      ansible.builtin.stat:
        path: /etc/nagios4/htpassword.users
      register: molecule_htpasswd_stat

    # Apache must be able to read the credential database without exposing it
    # to other local users.
    - name: Verify Nagios htpasswd file permissions
      ansible.builtin.assert:
        that:
          - molecule_htpasswd_stat.stat.exists
          - molecule_htpasswd_stat.stat.isreg
          - molecule_htpasswd_stat.stat.mode == '0640'
          - molecule_htpasswd_stat.stat.pw_name == 'root'
          - molecule_htpasswd_stat.stat.gr_name == 'www-data'

    ###########################################################################
    # Disabled feature cleanup
    ###########################################################################

    # LDAP is disabled in this scenario, so stale credential configuration
    # must not remain on disk.
    - name: Stat disabled LDAP credential file
      ansible.builtin.stat:
        path: /etc/apache2/conf-available/ldap.conf
      register: molecule_ldap_config_stat

    # Verify disabling LDAP removes its credential-bearing configuration.
    - name: Verify disabled LDAP credential file is absent
      ansible.builtin.assert:
        that:
          - not molecule_ldap_config_stat.stat.exists

    ###########################################################################
    # Rendered configuration content
    ###########################################################################

    # Read CGI configuration to validate scenario-specific variable overrides.
    - name: Read rendered CGI configuration
      ansible.builtin.slurp:
        src: /etc/nagios4/cgi.cfg
      register: molecule_cgi_config

    # Confirm the requested CGI override was rendered by the role.
    - name: Verify CGI configuration override was rendered
      ansible.builtin.assert:
        that:
          - "'show_context_help=1' in (molecule_cgi_config.content | b64decode)"

    # Read the main Nagios configuration for scenario-specific assertions.
    - name: Read rendered Nagios configuration
      ansible.builtin.slurp:
        src: /etc/nagios4/nagios.cfg
      register: molecule_nagios_config

    # Confirm the main Nagios configuration override was applied.
    - name: Verify Nagios configuration override was rendered
      ansible.builtin.assert:
        that:
          - >-
            'use_large_installation_tweaks=1' in
            (molecule_nagios_config.content | b64decode)

    # Read the Ansible-owned command aggregate for command rendering tests.
    - name: Read rendered Nagios commands
      ansible.builtin.slurp:
        src: /etc/nagios4/objects/commands.cfg
      register: molecule_commands_config

    # Verify additions and overrides were rendered and that an overridden
    # command was not duplicated.
    - name: Verify custom and overridden Nagios commands were rendered
      ansible.builtin.assert:
        that:
          - >-
            'check_molecule_marker' in
            (molecule_commands_config.content | b64decode)
          - >-
            'Molecule command OK' in
            (molecule_commands_config.content | b64decode)
          - >-
            'Molecule override $ARG2$' in
            (molecule_commands_config.content | b64decode)
          - >-
            (
              molecule_commands_config.content
              | b64decode
              | regex_findall('(?m)^\\s*command_name\\s+check_dummy\\s*$')
              | length
            ) == 1

    # Read the role-owned template aggregate for template rendering tests.
    - name: Read rendered Nagios templates
      ansible.builtin.slurp:
        src: /etc/nagios4/objects/templates.cfg
      register: molecule_templates_config

    # Confirm both normal object templates and contactgroup definitions were
    # rendered into the expected aggregate.
    - name: Verify standard service and contactgroup templates were rendered
      ansible.builtin.assert:
        that:
          - >-
            'name                           cisco-service' in
            (molecule_templates_config.content | b64decode)
          - >-
            'define contactgroup {' in
            (molecule_templates_config.content | b64decode)
          - >-
            'molecule-contactgroup-template' in
            (molecule_templates_config.content | b64decode)

    ###########################################################################
    # Nagios web authentication
    ###########################################################################

    # The Molecule instance uses a local test certificate, so certificate
    # validation is intentionally disabled only for localhost verification.
    - name: Verify unauthenticated Nagios request is rejected
      ansible.builtin.uri:
        url: https://127.0.0.1/nagios/
        validate_certs: false
        status_code: 401

    # Invalid credentials must not allow access to the Nagios web interface.
    - name: Verify invalid Nagios credentials are rejected
      ansible.builtin.uri:
        url: https://127.0.0.1/nagios/
        url_username: "{{ anro_nagios_users[0].name }}"
        url_password: invalid-password
        force_basic_auth: true
        validate_certs: false
        status_code: 401
      no_log: true

    # Valid role-managed credentials must successfully authenticate and return
    # content from the Nagios web interface.
    - name: Verify authenticated Nagios web interface is reachable
      ansible.builtin.uri:
        url: https://127.0.0.1/nagios/
        url_username: "{{ anro_nagios_users[0].name }}"
        url_password: "{{ anro_nagios_users[0].password }}"
        force_basic_auth: true
        follow_redirects: all
        validate_certs: false
        return_content: true
        status_code: 200
      register: molecule_authenticated_request
      no_log: true

    # A successful HTTP status alone is insufficient; verify page content was
    # actually returned.
    - name: Verify Nagios web content was returned
      ansible.builtin.assert:
        that:
          - molecule_authenticated_request.content | length > 0

    ###########################################################################
    # Prometheus exporter
    ###########################################################################

    # Metrics must not be exposed without authentication.
    - name: Verify unauthenticated Prometheus metrics request is rejected
      ansible.builtin.uri:
        url: http://127.0.0.1:9117/metrics
        status_code: 401

    # Invalid exporter credentials must be rejected.
    - name: Verify invalid Prometheus metrics credentials are rejected
      ansible.builtin.uri:
        url: http://127.0.0.1:9117/metrics
        url_username: "{{ anro_nagios_prometheus_auth_users[0].name }}"
        url_password: invalid-password
        force_basic_auth: true
        status_code: 401
      no_log: true

    # Valid exporter credentials must return the Prometheus payload.
    - name: Verify authenticated Prometheus metrics endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9117/metrics
        url_username: "{{ anro_nagios_prometheus_auth_users[0].name }}"
        url_password: "{{ anro_nagios_prometheus_auth_users[0].password }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: molecule_prometheus_metrics_request
      no_log: true

    # Verify the exporter returns a known Nagios metric rather than merely
    # returning an HTTP 200 response.
    - name: Verify Prometheus metrics content
      ansible.builtin.assert:
        that:
          - "'nagios_exporter_hosts 1' in molecule_prometheus_metrics_request.content"

    # The dedicated exporter listener should expose only /metrics and must not
    # make the backing PHP implementation directly accessible.
    - name: Verify exporter listener does not expose metrics.php directly
      ansible.builtin.uri:
        url: http://127.0.0.1:9117/metrics.php
        status_code: 404

    ###########################################################################
    # nagios-cmd repeatable test setup
    ###########################################################################

    # Remove artifacts from previous verify executions so repeated Molecule
    # runs do not append duplicate service blocks or reuse stale CLI objects.
    - name: Remove previous nagios-cmd verification artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ molecule_cli_cleanup_paths }}"

    # Install a service definition template outside the Ansible-owned object
    # aggregates so service-add behavior can be tested independently.
    - name: Install manual service definition used by nagios-cmd
      ansible.builtin.copy:
        dest: /etc/nagios4/servicedefs/molecule-ping.tpl
        owner: nagios
        group: nagios
        mode: "0640"
        content: |
          define service {
              use                     local-service
              host_name               molecule-helper-host
              service_description     Molecule Helper PING
              check_command           check_ping!100.0,20%!500.0,60%
          }

    # Create an administrator-owned command file that must survive a later
    # role reconvergence unchanged.
    - name: Install manual custom Nagios object
      ansible.builtin.copy:
        dest: /etc/nagios4/objects/commands/manual-molecule.cfg
        owner: nagios
        group: nagios
        mode: "0640"
        content: |
          define command {
              command_name            check_manual_molecule
              command_line            /usr/lib/nagios/plugins/check_dummy 0 "manual config preserved"
          }

    ###########################################################################
    # nagios-cmd host behavior
    ###########################################################################

    # Create a host without specifying use to prove the CLI supplies
    # generic-host automatically.
    - name: Create test host with default inheritance
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - host
          - add
          - "{{ nagios_test_host }}"
          - "192.0.2.10"
          - --force
      register: molecule_test_host_add
      changed_when: molecule_test_host_add.rc == 0

    # Read the generated host use directive through the CLI rather than
    # inspecting implementation details on disk.
    - name: Read test host use directive
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - host
          - get
          - "{{ nagios_test_host }}"
          - use
      register: molecule_test_host_use
      changed_when: false

    # Verify hosts without an explicit inheritance directive use generic-host.
    - name: Verify host defaults to generic-host
      ansible.builtin.assert:
        that:
          - molecule_test_host_use.stdout | trim == 'generic-host'
        fail_msg: >-
          Expected {{ nagios_test_host }} to inherit generic-host, got
          {{ molecule_test_host_use.stdout | trim }}.

    # Create a valid alternate parent template so the explicit override test
    # exercises behavior different from the built-in generic-host default.
    - name: Create alternate host parent template
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - add
          - "{{ nagios_test_parent_host_template }}"
          - -t
          - host
          - --force
      register: molecule_parent_host_template_add
      changed_when: molecule_parent_host_template_add.rc == 0

    # Explicit use must take precedence over the automatic generic-host value.
    - name: Create test host with explicit inheritance override
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - host
          - add
          - "{{ nagios_test_host_override }}"
          - "192.0.2.11"
          - --force
          - -o
          - "use={{ nagios_test_parent_host_template }}"
      register: molecule_test_host_override_add
      changed_when: molecule_test_host_override_add.rc == 0

    # Query the overridden host through the CLI to verify persisted state.
    - name: Read overridden host use directive
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - host
          - get
          - "{{ nagios_test_host_override }}"
          - use
      register: molecule_test_host_override_use
      changed_when: false

    # Verify the explicit parent template replaced the default generic-host
    # inheritance.
    - name: Verify explicit host use directive is preserved
      ansible.builtin.assert:
        that:
          - >-
            molecule_test_host_override_use.stdout | trim ==
            nagios_test_parent_host_template

    ###########################################################################
    # nagios-cmd contact and contactgroup behavior
    ###########################################################################

    # Contacts should inherit generic-contact when use is omitted while still
    # accepting contact-specific directives such as email.
    - name: Create test contact with default inheritance
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - contact
          - add
          - "{{ nagios_test_contact }}"
          - --force
          - -o
          - email=molecule@example.invalid
      register: molecule_test_contact_add
      changed_when: molecule_test_contact_add.rc == 0

    # Read the contact's inherited template through the public CLI interface.
    - name: Read test contact use directive
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - contact
          - get
          - "{{ nagios_test_contact }}"
          - use
      register: molecule_test_contact_use
      changed_when: false

    # Verify contacts automatically inherit the role-provided generic-contact
    # template.
    - name: Verify contact defaults to generic-contact
      ansible.builtin.assert:
        that:
          - molecule_test_contact_use.stdout | trim == 'generic-contact'

    # Create the Sev1 contact group that will be referenced by host and service
    # templates.
    - name: Create Sev1 contact group
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - contactgroup
          - add
          - "{{ nagios_test_contactgroup }}"
          - --force
          - -o
          - alias=Molecule Sev1 Contacts
      register: molecule_test_contactgroup_add
      changed_when: molecule_test_contactgroup_add.rc == 0

    # Exercise the contactgroup-specific -m option by assigning the test
    # contact as a direct member.
    - name: Add test contact to Sev1 contact group
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - contactgroup
          - set
          - "{{ nagios_test_contactgroup }}"
          - --force
          - -m
          - "{{ nagios_test_contact }}"
      register: molecule_test_contactgroup_set
      changed_when: molecule_test_contactgroup_set.rc == 0

    # Read contactgroup membership through nagios-cmd.
    - name: Read Sev1 contact group members
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - contactgroup
          - get
          - "{{ nagios_test_contactgroup }}"
          - members
      register: molecule_test_contactgroup_members
      changed_when: false

    # Verify the contact assignment was persisted exactly as requested.
    - name: Verify contact is a member of Sev1 contact group
      ansible.builtin.assert:
        that:
          - >-
            molecule_test_contactgroup_members.stdout | trim ==
            nagios_test_contact

    ###########################################################################
    # nagios-cmd template behavior
    ###########################################################################

    # Exercise the new -t shorthand while creating a host template and assign
    # the Sev1 contact group through a validated Nagios directive.
    - name: Create host template using short object-type option
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - add
          - "{{ nagios_test_host_template }}"
          - -t
          - host
          - --force
          - -o
          - "contact_groups={{ nagios_test_contactgroup }}"
      register: molecule_test_host_template_add
      changed_when: molecule_test_host_template_add.rc == 0

    # Read the host template's inherited parent.
    - name: Read host template use directive
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - get
          - "{{ nagios_test_host_template }}"
          - use
      register: molecule_test_host_template_use
      changed_when: false

    # Host templates should inherit generic-host unless use is explicitly
    # provided.
    - name: Verify host template defaults to generic-host
      ansible.builtin.assert:
        that:
          - molecule_test_host_template_use.stdout | trim == 'generic-host'

    # Read the contact group assigned to the host template.
    - name: Read host template contact groups
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - get
          - "{{ nagios_test_host_template }}"
          - contact_groups
      register: molecule_test_host_template_contacts
      changed_when: false

    # Verify contact_groups was accepted as a valid host property and persisted.
    - name: Verify host template uses Sev1 contact group
      ansible.builtin.assert:
        that:
          - >-
            molecule_test_host_template_contacts.stdout | trim ==
            nagios_test_contactgroup

    # Exercise the long --object-type spelling separately and verify service
    # templates receive generic-service inheritance automatically.
    - name: Create service template using long object-type option
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - add
          - "{{ nagios_test_service_template }}"
          - --object-type
          - service
          - --force
          - -o
          - "contact_groups={{ nagios_test_contactgroup }}"
      register: molecule_test_service_template_add
      changed_when: molecule_test_service_template_add.rc == 0

    # Read the service template inheritance through nagios-cmd.
    - name: Read service template use directive
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - get
          - "{{ nagios_test_service_template }}"
          - use
      register: molecule_test_service_template_use
      changed_when: false

    # Service templates must inherit generic-service when use is omitted.
    - name: Verify service template defaults to generic-service
      ansible.builtin.assert:
        that:
          - molecule_test_service_template_use.stdout | trim == 'generic-service'

    # Read the service template contact_groups property.
    - name: Read service template contact groups
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - get
          - "{{ nagios_test_service_template }}"
          - contact_groups
      register: molecule_test_service_template_contacts
      changed_when: false

    # Verify service templates can assign the Sev1 contact group.
    - name: Verify service template uses Sev1 contact group
      ansible.builtin.assert:
        that:
          - >-
            molecule_test_service_template_contacts.stdout | trim ==
            nagios_test_contactgroup

    ###########################################################################
    # nagios-cmd directive validation
    ###########################################################################

    # Intentionally pass the invalid singular "contact" property. The command
    # is allowed to fail here so its return code and diagnostic can be tested.
    - name: Attempt to create host template with invalid directive
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - add
          - molecule-invalid-template
          - -t
          - host
          - --force
          - -o
          - "contact={{ nagios_test_contactgroup }}"
      register: molecule_test_invalid_directive
      changed_when: false
      failed_when: false

    # Verify invalid directives are rejected before any configuration is
    # written and that the CLI provides the expected corrective suggestion.
    - name: Verify invalid directive is rejected
      ansible.builtin.assert:
        that:
          - molecule_test_invalid_directive.rc != 0
          - >-
            'invalid host directive' in
            (molecule_test_invalid_directive.stdout ~
             molecule_test_invalid_directive.stderr)
          - >-
            "'contact'" in
            (molecule_test_invalid_directive.stdout ~
             molecule_test_invalid_directive.stderr)
          - >-
            "'contacts'" in
            (molecule_test_invalid_directive.stdout ~
             molecule_test_invalid_directive.stderr)

    # Confirm rejection happened before an invalid object was created.
    - name: Query rejected invalid template
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - template
          - get
          - molecule-invalid-template
      register: molecule_test_invalid_template_get
      changed_when: false
      failed_when: false

    # The rejected object must remain absent from the active configuration.
    - name: Verify invalid template was not created
      ansible.builtin.assert:
        that:
          - molecule_test_invalid_template_get.rc != 0

    ###########################################################################
    # nagios-cmd command and service behavior
    ###########################################################################

    # Create the helper host used by the service definition template.
    - name: Add helper host using nagios-cmd
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - host
          - add
          - molecule-helper-host
          - 127.0.0.2
          - --force
      register: molecule_helper_host_add
      changed_when: molecule_helper_host_add.rc == 0

    # Create a standalone administrator-managed command using a valid
    # command_line directive.
    - name: Add custom command using nagios-cmd
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - command
          - add
          - check_molecule_helper
          - --options
          - command_line=/usr/lib/nagios/plugins/check_dummy 0 helper-ok
          - --force
      register: molecule_helper_command_add
      changed_when: molecule_helper_command_add.rc == 0

    # Render the manual service definition template into the helper host to
    # verify service add behavior.
    - name: Add service definition to custom host using nagios-cmd
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - service
          - add
          - molecule-helper-host
          - --services
          - molecule-ping
          - --force
      register: molecule_helper_service_add
      changed_when: molecule_helper_service_add.rc == 0

    # Attempting to modify an Ansible-owned aggregate object must be rejected
    # even when --force is supplied.
    - name: Attempt to modify Ansible-owned command using nagios-cmd
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - command
          - set
          - check_dummy
          - --options
          - command_line=/usr/lib/nagios/plugins/check_dummy 2 forbidden
          - --force
      register: molecule_helper_managed_boundary
      changed_when: false
      failed_when: false

    # Verify nagios-cmd enforces the ownership boundary rather than silently
    # modifying configuration controlled by Ansible.
    - name: Verify nagios-cmd refuses to modify Ansible-owned command
      ansible.builtin.assert:
        that:
          - molecule_helper_managed_boundary.rc == 1
          - >-
            'refusing to modify Ansible/default-owned object' in
            (molecule_helper_managed_boundary.stdout ~
             molecule_helper_managed_boundary.stderr)

    ###########################################################################
    # Complete nagios-cmd configuration validation
    ###########################################################################

    # All independently-created custom objects should form one valid Nagios
    # configuration before reconvergence is attempted.
    - name: Validate configuration after nagios-cmd changes
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - config
          - check
      register: molecule_nagios_cmd_config_check
      changed_when: false

    # Verify the nagios-cmd validation command explicitly reports success.
    - name: Verify nagios-cmd configuration validation succeeded
      ansible.builtin.assert:
        that:
          - molecule_nagios_cmd_config_check.rc == 0
          - >-
            'Nagios configuration OK' in
            molecule_nagios_cmd_config_check.stdout

    ###########################################################################
    # Administrator-managed ownership and permissions
    ###########################################################################

    # Capture checksums and metadata for every administrator-managed test file
    # before the role is deliberately reconverged.
    - name: Stat custom configuration before reconverge
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      register: molecule_custom_before
      loop: "{{ molecule_custom_paths }}"

    # nagios-cmd and manually-created custom objects must use the shared
    # nagios:nagios ownership and restrictive file mode.
    - name: Verify custom files have expected ownership and permissions
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == '0640'
          - item.stat.pw_name == 'nagios'
          - item.stat.gr_name == 'nagios'
        fail_msg: >-
          {{ item.item }} does not have the expected nagios:nagios ownership
          and 0640 mode.
      loop: "{{ molecule_custom_before.results }}"
      loop_control:
        label: "{{ item.item }}"

    ###########################################################################
    # Role reconvergence boundary
    ###########################################################################

    # Deliberately run the role again after administrator-managed files exist
    # to verify ownership boundaries remain intact during future automation.
    - name: Reconverge role after administrator-managed changes
      ansible.builtin.include_role:
        name: anro_nagios

    # Capture the same files after reconvergence for direct checksum comparison.
    - name: Stat custom configuration after reconverge
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      register: molecule_custom_after
      loop: "{{ molecule_custom_paths }}"

    # Every administrator-managed file must still exist and have exactly the
    # same content after the role executes again.
    - name: Verify Ansible preserved administrator-managed configuration
      ansible.builtin.assert:
        that:
          - item.0.stat.exists
          - item.1.stat.exists
          - item.0.stat.checksum == item.1.stat.checksum
        fail_msg: >-
          Role reconverge changed administrator-managed file {{ item.0.item }}.
      loop: >-
        {{
          molecule_custom_before.results
          | zip(molecule_custom_after.results)
          | list
        }}
      loop_control:
        label: "{{ item.0.item }}"

    # Revalidate the entire configuration after role reconvergence to prove
    # Ansible-owned and administrator-owned objects remain compatible.
    - name: Validate Nagios after role reconverge
      ansible.builtin.command:
        argv:
          - "{{ nagios_cmd_path }}"
          - config
          - check
      register: molecule_final_nagios_config_check
      changed_when: false

    # The final verification gate requires a valid Nagios configuration after
    # every preceding test and the role reconvergence.
    - name: Verify final Nagios configuration is valid
      ansible.builtin.assert:
        that:
          - molecule_final_nagios_config_check.rc == 0
          - >-
            'Nagios configuration OK' in
            molecule_final_nagios_config_check.stdout
